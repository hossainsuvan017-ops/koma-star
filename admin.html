
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koma Star Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore-compat.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#070707;
  color:#fff;
  min-height:100vh;
}

header{
  background:#111;
  padding:18px 20px;
  border-bottom:1px solid #292929;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:25px;
  font-weight:800;
}

.logo span{
  color:#e50914;
}

.container{
  width:min(100%,900px);
  margin:auto;
  padding:20px;
}

.card{
  background:#111;
  border:1px solid #292929;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
}

h2{
  margin-bottom:18px;
}

label{
  display:block;
  margin:14px 0 7px;
  color:#bbb;
  font-size:14px;
}

input,textarea,select{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #333;
  background:#1b1b1b;
  color:#fff;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  cursor:pointer;
  font-weight:bold;
}

.publish{
  width:100%;
  margin-top:20px;
  background:#e50914;
  color:#fff;
  font-size:16px;
}

.publish:active{
  transform:scale(.98);
}

.movie{
  background:#191919;
  border:1px solid #292929;
  padding:15px;
  border-radius:14px;
  margin-top:12px;
}

.movie-title{
  font-size:18px;
  font-weight:bold;
}

.movie-info{
  color:#aaa;
  font-size:13px;
  margin-top:6px;
}

.delete{
  margin-top:10px;
  background:#333;
  color:#fff;
}

.status{
  padding:12px;
  border-radius:10px;
  background:#191919;
  color:#aaa;
  margin-bottom:15px;
}

.success{
  color:#5cff8d;
}

.error{
  color:#ff6b6b;
}

@media(max-width:600px){
  .row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo"><span>K</span>oma Star — Admin</div>
</header>

<div class="container">

  <div class="card">
    <h2>🎬 Add New Movie</h2>

    <div id="status" class="status">
      Connecting to Firebase...
    </div>

    <label>Movie Title</label>
    <input id="title" placeholder="Example: The Last Mission">

    <label>Genre</label>
    <select id="genre">
      <option>Action</option>
      <option>Drama</option>
      <option>Comedy</option>
      <option>Romance</option>
      <option>Thriller</option>
      <option>Horror</option>
      <option>Adventure</option>
      <option>Reality</option>
    </select>

    <label>Description</label>
    <textarea id="description"
      placeholder="Write movie description"></textarea>

    <div class="row">

      <div>
        <label>Year</label>
        <input id="year" type="number" placeholder="2026">
      </div>

      <div>
        <label>Rating</label>
        <input id="rating" type="number" step="0.1"
          placeholder="8.5">
      </div>

    </div>

    <label>Poster Image URL</label>
    <input id="posterUrl"
      placeholder="https://example.com/poster.jpg">

    <label>Video URL</label>
    <input id="videoUrl"
      placeholder="https://example.com/video.mp4">

    <button class="publish" onclick="publishMovie()">
      🚀 Publish Movie
    </button>

  </div>


  <div class="card">

    <h2>🎥 Published Movies</h2>

    <div id="movieList">
      Loading movies...
    </div>

  </div>

</div>


<script>

/* ================================
   KOMA STAR FIREBASE CONFIG
================================ */

const firebaseConfig = {
  apiKey: "AIzaSyD9Qt5x69KsB3VxOuvTbrDXYJHF3nN5acs",
  authDomain: "koma-star.firebaseapp.com",
  projectId: "koma-star",
  storageBucket: "koma-star.firebasestorage.app",
  messagingSenderId: "314141087569",
  appId: "1:314141087569:web:e1861e72db4f9ef5b12570",
  measurementId: "G-HYF2PZY5GR"
};


/* ================================
   FIREBASE START
================================ */

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const statusBox = document.getElementById("status");

statusBox.innerHTML =
  "✅ Firebase connected";

statusBox.className =
  "status success";


/* ================================
   PUBLISH MOVIE
================================ */

async function publishMovie(){

  const title =
    document.getElementById("title").value.trim();

  const genre =
    document.getElementById("genre").value;

  const description =
    document.getElementById("description").value.trim();

  const year =
    Number(document.getElementById("year").value);

  const rating =
    Number(document.getElementById("rating").value);

  const posterUrl =
    document.getElementById("posterUrl").value.trim();

  const videoUrl =
    document.getElementById("videoUrl").value.trim();


  if(!title){

    alert("Movie Title লিখুন");
    return;

  }


  if(!description){

    alert("Description লিখুন");
    return;

  }


  if(!year){

    alert("Year লিখুন");
    return;

  }


  if(!rating){

    alert("Rating লিখুন");
    return;

  }


  try{

    await db.collection("movies").add({

      title: title,

      genre: genre,

      description: description,

      year: year,

      rating: rating,

      posterUrl: posterUrl,

      videoUrl: videoUrl,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });


    alert("🎉 Movie successfully published!");

    clearForm();

    loadMovies();

  }

  catch(error){

    console.error(error);

    alert(
      "Movie publish হয়নি। Firestore Security Rules check করুন।\n\n"
      + error.message
    );

  }

}


/* ================================
   CLEAR FORM
================================ */

function clearForm(){

  document.getElementById("title").value = "";

  document.getElementById("description").value = "";

  document.getElementById("year").value = "";

  document.getElementById("rating").value = "";

  document.getElementById("posterUrl").value = "";

  document.getElementById("videoUrl").value = "";

}


/* ================================
   LOAD MOVIES
================================ */

async function loadMovies(){

  const list =
    document.getElementById("movieList");

  list.innerHTML =
    "Loading...";

  try{

    const snapshot =
      await db.collection("movies")
      .orderBy("createdAt","desc")
      .get();


    if(snapshot.empty){

      list.innerHTML =
        "No movies published yet.";

      return;

    }


    list.innerHTML = "";


    snapshot.forEach(doc => {

      const movie = doc.data();

      const div =
        document.createElement("div");

      div.className =
        "movie";


      div.innerHTML = `

        <div class="movie-title">
          ${escapeHtml(movie.title || "Untitled")}
        </div>

        <div class="movie-info">
          ${escapeHtml(movie.genre || "")}
          •
          ${movie.year || ""}
          • ⭐ ${movie.rating || ""}
        </div>

        <button
          class="delete"
          onclick="deleteMovie('${doc.id}')">
          🗑 Delete
        </button>

      `;

      list.appendChild(div);

    });

  }

  catch(error){

    console.error(error);

    list.innerHTML =
      "Movies load হয়নি। Firestore Rules check করুন.";

  }

}


/* ================================
   DELETE MOVIE
================================ */

async function deleteMovie(id){

  const ok =
    confirm(
      "এই movie delete করতে চান?"
    );

  if(!ok) return;


  try{

    await db
      .collection("movies")
      .doc(id)
      .delete();


    alert("Movie deleted");

    loadMovies();

  }

  catch(error){

    alert(
      "Delete হয়নি: "
      + error.message
    );

  }

}


/* ================================
   SECURITY HELPER
================================ */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ================================
   START
================================ */

loadMovies();

</script>

</body>
</html>
